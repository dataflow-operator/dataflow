
apiVersion: dataflow.dataflow.io/v1
kind: DataFlow
metadata:
  name: pg-to-pg-test
spec:
  source:
    type: postgresql
    postgresql:
      connectionString: "postgres://dataflow:dataflow@localhost:5432/dataflow?sslmode=disable"
      table: public.products
      pollInterval: 5
  sink:
    type: postgresql
    postgresql:
      connectionString: "postgres://dataflow:dataflow@localhost:5432/dataflow?sslmode=disable"
      table: public.products_clone
      autoCreateTable: true
      upsertMode: true
      batchSize: 10
      batchFlushIntervalSeconds: 2
